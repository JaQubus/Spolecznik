description = "Offline pipeline danych dla Społecznika: scraping, PDF-y, BDL, wzbogacanie, embeddingi, ewaluacja"
requires-python = ">=3.12"
dependencies = [
  "playwright",
  "pymupdf",
  "httpx",
  "truststore",
  "numpy",
  "scikit-learn",
  "psycopg[binary]",
  "python-dotenv",
]
